<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅遊土狗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2ede2;
    --card: #fffdf8;
    --line: #ddd3bd;
    --ink: #2b2924;
    --muted: #7a7263;
    --accent: #3c5560;
    --accent-soft: #e2e8e3;
    --ok-bg: #edf0e4;
    --ok-ink: #47542f;
    --err-bg: #f4e9e3;
    --err-ink: #7c4230;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    margin: 0; background: var(--paper); color: var(--ink); font-size: 15.5px; font-weight: 500;
    padding: 18px; padding-top: calc(18px + env(safe-area-inset-top));
    padding-bottom: calc(92px + env(safe-area-inset-bottom));
  }

  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; }
  h1 {
    font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 25px; margin: 0;
    letter-spacing: 0.04em; color: var(--ink);
  }
  .sub { font-size: 14px; color: var(--muted); margin: 4px 0 20px; letter-spacing: 0.02em; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 18px; margin-bottom: 16px; }
  .card-title { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .badge {
    width: 36px; height: 36px; min-width: 36px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
  }
  .badge svg { width: 20px; height: 20px; display: block; }
  .card-title h2 { font-size: 16.5px; margin: 0; font-weight: 700; letter-spacing: 0.03em; color: var(--ink); }

  label { display: block; font-size: 13.5px; color: var(--muted); margin: 14px 0 6px; letter-spacing: 0.02em; font-weight: 500; }
  input[type=text], input[type=number] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px;
    font-size: 16px; background: #fff; color: var(--ink); font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row button {
    flex: 1; min-width: 70px; padding: 9px 6px; border: 1px solid var(--line); border-radius: 3px;
    background: #fff; font-size: 14.5px; color: var(--muted); font-family: inherit; font-weight: 500;
  }
  .btn-row button.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 500; }

  .primary-btn {
    width: 100%; padding: 13px; margin-top: 18px; background: var(--accent); color: #faf8f2;
    border: none; border-radius: 3px; font-size: 15.5px; letter-spacing: 0.06em; font-family: inherit; font-weight: 700;
  }
  .primary-btn:disabled { background: #b6ae9d; }

  .hidden { display: none !important; }

  .result { margin-top: 12px; padding: 11px 12px; border-radius: 3px; font-size: 13px; white-space: pre-wrap; line-height: 1.55; }
  .result.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .result.err { background: var(--err-bg); color: var(--err-ink); }

  .refresh-btn {
    font-size: 12px; color: var(--accent); background: none; border: none;
    text-decoration: underline; padding: 0; letter-spacing: 0.02em; font-family: inherit;
  }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .card-head .card-title { margin-bottom: 0; }

  .subtabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .subtabs button {
    flex: 1; padding: 10px 6px; border: 1px solid var(--line); border-radius: 3px;
    background: #fff; color: var(--muted); font-size: 14.5px; font-family: inherit; letter-spacing: 0.03em; font-weight: 500;
  }
  .subtabs button.active { background: var(--accent); color: #faf8f2; border-color: var(--accent); font-weight: 500; }
  .subview { display: none; }
  .subview.active { display: block; }

  nav.tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    display: flex;
  }
  nav.tabbar button {
    flex: 1; border: none; background: none; padding: 11px 4px 9px;
    font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 5px;
    font-family: inherit; letter-spacing: 0.02em; font-weight: 600;
  }
  nav.tabbar .tab-badge {
    width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); color: var(--muted);
  }
  nav.tabbar .tab-badge svg { width: 17px; height: 17px; display: block; }
  nav.tabbar button.active { color: var(--accent); font-weight: 500; }
  nav.tabbar button.active .tab-badge { background: var(--accent); color: #faf8f2; border-color: var(--accent); }

  .view { display: none; }
  .view.active { display: block; }

  .exchange-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .exchange-row input { flex: 1; }
  .exchange-unit { font-size: 13px; color: var(--muted); white-space: nowrap; }

  /* 結構化列表（行程 / 記帳紀錄 / 購物清單 共用） */
  .day-group { margin-bottom: 18px; }
  .day-group:last-child { margin-bottom: 0; }
  .day-header {
    display: flex; align-items: center; gap: 8px; font-family: "Noto Serif TC", serif;
    font-weight: 700; font-size: 16px; color: var(--accent); margin-bottom: 8px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .stop-row { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .stop-row:last-child { border-bottom: none; }
  .stop-time {
    min-width: 50px; font-size: 13.5px; color: var(--muted); padding-top: 1px; font-variant-numeric: tabular-nums; font-weight: 500;
  }
  .stop-time.empty { color: #c7bfa8; }
  .stop-main { flex: 1; }
  .stop-loc { font-size: 15.5px; color: var(--ink); font-weight: 500; }
  .stop-detail { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .stop-detail a { color: var(--accent); }
  .empty-note { font-size: 14.5px; color: var(--muted); padding: 6px 0; }

  .chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .unscheduled-chip {
    display: inline-flex; align-items: center; padding: 6px 10px;
    background: var(--accent-soft); border-radius: 20px; font-size: 14px; color: var(--ink); font-weight: 500;
    text-decoration: none;
  }
  a.unscheduled-chip { cursor: pointer; }
  a.unscheduled-chip::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-left: 6px; }

  /* 結算專用 */
  .settle-grid { display: flex; gap: 10px; margin-bottom: 14px; }
  .settle-person { flex: 1; border: 1px solid var(--line); border-radius: 4px; padding: 12px; background: #fff; }
  .settle-name { font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 15.5px; color: var(--ink); margin-bottom: 8px; }
  .settle-nums div { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 3px 0; }
  .settle-nums b { color: var(--ink); font-size: 14.5px; font-weight: 700; }
  .settle-net { text-align: center; padding: 13px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-size: 15px; font-weight: 500; }
  .settle-net strong { font-size: 19px; margin-left: 4px; }
  .settle-net.even { background: var(--ok-bg); color: var(--ok-ink); }

  /* 刪除按鈕 */
  .del-btn {
    border: none; background: none; color: #b3897c; padding: 4px; margin-left: 6px;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .del-btn svg { width: 16px; height: 16px; display: block; }
  .stop-row { align-items: flex-start; }
  .stop-row-inner { display: flex; flex: 1; justify-content: space-between; align-items: center; }
  .unscheduled-chip-wrap { display: inline-flex; align-items: center; background: var(--accent-soft); border-radius: 20px; padding: 2px 4px 2px 12px; gap: 4px; }
  .unscheduled-chip-wrap .unscheduled-chip { background: none; padding: 0; border-radius: 0; }
  .unscheduled-chip-wrap .del-btn { color: #a9776b; }

</style>
</head>
<body>
  <header>
    <h1>旅遊土狗</h1>
  </header>
  <p class="sub">你的旅遊小助手</p>

  <!-- ============ 記帳 ============ -->
  <section id="view-money" class="view active">
    <div class="subtabs">
      <button type="button" class="active" onclick="switchSub('money','add')">新增</button>
      <button type="button" onclick="switchSub('money','view')">查看</button>
    </div>

    <div id="money-add" class="subview active">
      <div class="card">
        <div class="card-title"><span class="badge" id="icon-money"></span><h2 id="m-form-title">新增記帳</h2></div>
        <div id="m-editing-note" class="hidden" style="font-size:12.5px;color:var(--accent);margin-bottom:10px;">
          正在編輯既有資料　<button type="button" class="refresh-btn" onclick="cancelEditExpense()">取消編輯</button>
        </div>
        <label>付款人</label>
        <div class="btn-row" id="payerGroup">
          <button type="button" data-val="脆" class="active" onclick="selectGroup(this,'payerGroup',v=>payer=v)">脆</button>
          <button type="button" data-val="捲" onclick="selectGroup(this,'payerGroup',v=>payer=v)">捲</button>
        </div>

        <label>項目</label>
        <input type="text" id="m-item" placeholder="例：晚餐">

        <label>金額</label>
        <input type="number" id="m-amount" placeholder="例：600">

        <label>幣別</label>
        <div class="btn-row" id="currGroup">
          <button type="button" data-val="日幣" class="active" onclick="selectGroup(this,'currGroup',v=>currency=v)">日幣</button>
          <button type="button" data-val="台幣" onclick="selectGroup(this,'currGroup',v=>currency=v)">台幣</button>
        </div>

        <label>類型</label>
        <div class="btn-row" id="typeGroup">
          <button type="button" data-val="個人" class="active" onclick="selectType(this)">個人</button>
          <button type="button" data-val="平分" onclick="selectType(this)">平分</button>
          <button type="button" data-val="指定" onclick="selectType(this)">指定金額</button>
        </div>

        <div id="specifiedBox" class="hidden">
          <label>另一人負擔金額</label>
          <input type="number" id="m-otherAmount" placeholder="例：200">
        </div>

        <button class="primary-btn" id="m-submitBtn" onclick="submitExpense()">送出記帳</button>
        <div id="m-resultBox"></div>
      </div>
    </div>

    <div id="money-view" class="subview">
      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="badge" id="icon-chart"></span><h2>目前結算</h2></div>
          <button class="refresh-btn" onclick="loadSettlement()">重新整理</button>
        </div>
        <div id="settlementBox"><p class="empty-note">載入中...</p></div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="badge" id="icon-receipt"></span><h2>最近記帳紀錄</h2></div>
          <button class="refresh-btn" onclick="loadRecentAccounting()">重新整理</button>
        </div>
        <div id="recentBox"><p class="empty-note">載入中...</p></div>
      </div>
    </div>
  </section>

  <!-- ============ 行程 ============ -->
  <section id="view-trip" class="view">
    <div class="subtabs">
      <button type="button" class="active" onclick="switchSub('trip','add')">新增</button>
      <button type="button" onclick="switchSub('trip','view')">查看</button>
    </div>

    <div id="trip-add" class="subview active">
      <div class="card">
        <div class="card-title"><span class="badge" id="icon-calendar"></span><h2>新增行程</h2></div>
        <label>地點</label>
        <input type="text" id="t-location" placeholder="例：黑門市場">

        <label>日期（選填，格式 M/D，例如 10/18）</label>
        <input type="text" id="t-date" placeholder="不填代表尚未排定">

        <label>時間（選填，格式 HH:MM，例如 15:00）</label>
        <input type="text" id="t-time" placeholder="不填代表只排日期">

        <label>地區（選填，需與設定分頁的地區名稱一致）</label>
        <input type="text" id="t-region" placeholder="例：京都">

        <button class="primary-btn" id="t-submitBtn" onclick="submitItinerary()">送出行程</button>
        <div id="t-resultBox"></div>
      </div>
    </div>

    <div id="trip-view" class="subview">
      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="badge" id="icon-map"></span><h2>整體行程</h2></div>
          <button class="refresh-btn" onclick="loadItineraryStructured()">重新整理</button>
        </div>
        <div id="itineraryDays"><p class="empty-note">載入中...</p></div>
      </div>

      <div class="card">
        <div class="card-title"><span class="badge" id="icon-flag"></span><h2>尚未安排</h2></div>
        <div id="itineraryUnscheduled"><p class="empty-note">載入中...</p></div>
      </div>
    </div>
  </section>

  <!-- ============ 購物 ============ -->
  <section id="view-shop" class="view">
    <div class="subtabs">
      <button type="button" class="active" onclick="switchSub('shop','add')">新增</button>
      <button type="button" onclick="switchSub('shop','view')">查看</button>
    </div>

    <div id="shop-add" class="subview active">
      <div class="card">
        <div class="card-title"><span class="badge" id="icon-bag"></span><h2>加入購物清單</h2></div>
        <label>物品</label>
        <input type="text" id="s-item" placeholder="例：面膜">

        <label>提醒日期（選填，格式 M/D）</label>
        <input type="text" id="s-date" placeholder="不填代表沒有特定日期">

        <button class="primary-btn" id="s-submitBtn" onclick="submitShopping()">加入清單</button>
        <div id="s-resultBox"></div>
      </div>

      <div class="card">
        <div class="card-title"><span class="badge" id="icon-check"></span><h2>標記已買</h2></div>
        <label>物品名稱</label>
        <input type="text" id="s-boughtItem" placeholder="要跟清單上的名稱一致">
        <button class="primary-btn" id="s-boughtBtn" onclick="submitBought()">標記已買</button>
        <div id="s-boughtResultBox"></div>
      </div>

      <div class="card">
        <div class="card-title"><span class="badge" id="icon-compare"></span><h2>記一筆比價</h2></div>
        <label>物品</label>
        <input type="text" id="s-cItem" placeholder="例：合利他命">
        <label>通路</label>
        <input type="text" id="s-vendor" placeholder="例：大國藥妝">
        <label>價格</label>
        <input type="number" id="s-price" placeholder="例：500">
        <button class="primary-btn" id="s-priceBtn" onclick="submitPriceCompare()">記錄比價</button>
        <div id="s-priceResultBox"></div>
      </div>
    </div>

    <div id="shop-view" class="subview">
      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="badge" id="icon-cart"></span><h2>目前購物清單</h2></div>
          <button class="refresh-btn" onclick="loadShoppingStructured()">重新整理</button>
        </div>
        <div id="shoppingBox"><p class="empty-note">載入中...</p></div>
      </div>
    </div>
  </section>

  <!-- ============ 匯率 ============ -->
  <section id="view-exchange" class="view">
    <div class="card">
      <div class="card-title"><span class="badge" id="icon-exchange"></span><h2>匯率換算</h2></div>
      <div class="btn-row" id="exFromGroup">
        <button type="button" data-val="日" class="active" onclick="selectGroup(this,'exFromGroup',v=>exFrom=v)">日幣 →</button>
        <button type="button" data-val="台" onclick="selectGroup(this,'exFromGroup',v=>exFrom=v)">台幣 →</button>
      </div>
      <div class="exchange-row">
        <input type="number" id="ex-amount" placeholder="輸入金額">
        <span class="exchange-unit" id="ex-unit">日幣</span>
      </div>
      <button class="primary-btn" id="ex-submitBtn" onclick="submitExchange()">換算</button>
      <div id="ex-resultBox"></div>
    </div>
  </section>

  <nav class="tabbar">
    <button type="button" class="active" data-view="view-money" onclick="switchTab(this)">
      <span class="tab-badge" id="tab-money"></span>記帳
    </button>
    <button type="button" data-view="view-trip" onclick="switchTab(this)">
      <span class="tab-badge" id="tab-trip"></span>行程
    </button>
    <button type="button" data-view="view-shop" onclick="switchTab(this)">
      <span class="tab-badge" id="tab-shop"></span>購物
    </button>
    <button type="button" data-view="view-exchange" onclick="switchTab(this)">
      <span class="tab-badge" id="tab-exchange"></span>匯率
    </button>
  </nav>

<script>
  // 換成你自己在 Apps Script 部署出來的網址（結尾是 /exec）
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzCwqpZwNApZemLgDqQRFckKICMFXnbj3Fuh5UOgqxoYyoZ774Diiqupt9j4kEC9r-v/exec';

  /* ---------- 單色線條圖示（不用 emoji，全部用主色系 currentColor） ---------- */
  const ICONS = {
    money: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8H6a3 3 0 1 1 0-6h11a1 1 0 0 1 1 1v5Z"/><path d="M3 8v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6"/><circle cx="17" cy="13" r="1.1" fill="currentColor" stroke="none"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/></svg>',
    bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8h11l-1 11.5a2 2 0 0 1-2 1.8H9.5a2 2 0 0 1-2-1.8L6.5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>',
    exchange: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12M15 4l3 4-3 4"/><path d="M18 16H6M9 20l-3-4 3-4"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V4M16 20v-6"/><path d="M3 20h18"/></svg>',
    receipt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2-2 1.2V3Z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
    map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 4 4 6.2v13.8l5-2.2 6 2.2 5-2.2V3.8l-5 2.2-6-2.2Z"/><path d="M9 4v13.8M15 6.2V20"/></svg>',
    flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 5h13l-3 4 3 4H5"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.3l2.6 2.6L16.2 9"/></svg>',
    compare: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="10.5" width="5" height="9.5"/><rect x="14.5" y="5.5" width="5" height="14.5"/></svg>',
    cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 11.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L20.5 8H6"/><circle cx="9.5" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M10 11v6M14 11v6"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.5L15.5 5 19 8.5 8.5 19 4 20Z"/><path d="M13.5 6.5 17.5 10.5"/></svg>'
  };
  function mountIcons() {
    document.getElementById('icon-money').innerHTML = ICONS.money;
    document.getElementById('icon-chart').innerHTML = ICONS.chart;
    document.getElementById('icon-receipt').innerHTML = ICONS.receipt;
    document.getElementById('icon-calendar').innerHTML = ICONS.calendar;
    document.getElementById('icon-map').innerHTML = ICONS.map;
    document.getElementById('icon-flag').innerHTML = ICONS.flag;
    document.getElementById('icon-bag').innerHTML = ICONS.bag;
    document.getElementById('icon-check').innerHTML = ICONS.check;
    document.getElementById('icon-compare').innerHTML = ICONS.compare;
    document.getElementById('icon-cart').innerHTML = ICONS.cart;
    document.getElementById('icon-exchange').innerHTML = ICONS.exchange;
    document.getElementById('tab-money').innerHTML = ICONS.money;
    document.getElementById('tab-trip').innerHTML = ICONS.calendar;
    document.getElementById('tab-shop').innerHTML = ICONS.bag;
    document.getElementById('tab-exchange').innerHTML = ICONS.exchange;
  }

  let payer = '脆';
  let currency = '日幣';
  let type = '個人';
  let exFrom = '日';

  function switchTab(btn) {
    document.querySelectorAll('nav.tabbar button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.view).classList.add('active');
  }

  function switchSub(group, mode) {
    document.querySelectorAll('#view-' + (group === 'money' ? 'money' : group === 'trip' ? 'trip' : 'shop') + ' .subtabs button')
      .forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(group + '-add').classList.toggle('active', mode === 'add');
    document.getElementById(group + '-view').classList.toggle('active', mode === 'view');
    if (mode === 'view') {
      if (group === 'money') { loadSettlement(); loadRecentAccounting(); }
      if (group === 'trip') { loadItineraryStructured(); }
      if (group === 'shop') { loadShoppingStructured(); }
    }
  }

  function selectGroup(btn, groupId, setter) {
    setter(btn.dataset.val);
    document.querySelectorAll('#' + groupId + ' button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (groupId === 'exFromGroup') {
      document.getElementById('ex-unit').textContent = exFrom === '日' ? '日幣' : '台幣';
    }
  }
  function selectType(btn) {
    type = btn.dataset.val;
    document.querySelectorAll('#typeGroup button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('specifiedBox').classList.toggle('hidden', type !== '指定');
  }

  // 單次 JSONP 呼叫（逾時拉長到 25 秒，Apps Script 剛被閒置喚醒時第一次呼叫常常較慢）
  function jsonpOnce(params) {
    return new Promise((resolve, reject) => {
      const callbackName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      const fullParams = Object.assign({}, params, { callback: callbackName });
      const query = Object.keys(fullParams)
        .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(fullParams[k] == null ? '' : fullParams[k]))
        .join('&');

      const script = document.createElement('script');
      const timeout = setTimeout(() => { cleanup(); reject(new Error('連線逾時')); }, 25000);
      function cleanup() { clearTimeout(timeout); delete window[callbackName]; script.remove(); }

      window[callbackName] = function (data) { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error('連線失敗')); };
      script.src = GAS_URL + '?' + query;
      document.body.appendChild(script);
    });
  }

  // 失敗（逾時／連線失敗）自動重試一次，通常是 Apps Script 剛被喚醒比較慢，重試就會成功
  function jsonp(params) {
    return jsonpOnce(params).catch(err => {
      console.warn('第一次呼叫失敗，自動重試一次：', err.message);
      return jsonpOnce(params).catch(err2 => {
        throw new Error('連線逾時或失敗（已自動重試一次），請稍後再試');
      });
    });
  }

  function showResult(boxId, res) {
    document.getElementById(boxId).innerHTML =
      '<div class="result ' + (res.ok ? 'ok' : 'err') + '">' + res.message + '</div>';
  }
  function showError(boxId, err) {
    document.getElementById(boxId).innerHTML = '<div class="result err">' + err.message + '</div>';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------- 記帳：新增 ---------- */
  function submitExpense() {
    const item = document.getElementById('m-item').value.trim();
    const amount = document.getElementById('m-amount').value.trim();
    const otherAmount = document.getElementById('m-otherAmount').value.trim();
    if (!item || !amount) { showResult('m-resultBox', { ok: false, message: '請填寫項目與金額' }); return; }

    const btn = document.getElementById('m-submitBtn');
    const isEditing = editingRow !== null;
    btn.disabled = true; btn.textContent = isEditing ? '更新中...' : '送出中...';

    const action = isEditing ? 'updateExpense' : 'addExpense';
    const params = { action, payer, item, amount, currency, type, otherAmount };
    if (isEditing) params.row = editingRow;

    jsonp(params)
      .then(res => {
        showResult('m-resultBox', res);
        if (res.ok) {
          if (isEditing) {
            cancelEditExpense();
            loadRecentAccounting();
            loadSettlement();
          } else {
            document.getElementById('m-item').value = '';
            document.getElementById('m-amount').value = '';
            document.getElementById('m-otherAmount').value = '';
          }
        }
        btn.disabled = false; btn.textContent = editingRow !== null ? '更新記帳' : '送出記帳';
      })
      .catch(err => {
        btn.disabled = false; btn.textContent = isEditing ? '更新記帳' : '送出記帳';
        showError('m-resultBox', err);
      });
  }

  /* ---------- 記帳：查看 ---------- */
  function renderSettlement(res) {
    if (!res.ok) return '<p class="empty-note">' + esc(res.message) + '</p>';
    const grid = '<div class="settle-grid">' + res.people.map(p =>
      '<div class="settle-person"><div class="settle-name">' + esc(p.name) + '</div>' +
      '<div class="settle-nums"><div><span>總支出</span><b>NT$' + p.paid + '</b></div>' +
      '<div><span>總花費</span><b>NT$' + p.expense + '</b></div></div></div>'
    ).join('') + '</div>';
    const net = res.net.settled
      ? '<div class="settle-net even">目前平手，互不相欠</div>'
      : '<div class="settle-net">' + esc(res.net.text) + '<strong>NT$' + res.net.amount + '</strong></div>';
    return grid + net;
  }

  function loadSettlement() {
    document.getElementById('settlementBox').innerHTML = '<p class="empty-note">載入中...</p>';
    jsonp({ action: 'getSettlementStructured' })
      .then(res => { document.getElementById('settlementBox').innerHTML = renderSettlement(res); })
      .catch(err => { document.getElementById('settlementBox').innerHTML = '<p class="empty-note">讀取失敗：' + esc(err.message) + '</p>'; });
  }

  let recentAccountingCache = {};

  function renderRecentAccounting(res) {
    if (!res.ok) return '<p class="empty-note">' + esc(res.message) + '</p>';
    if (!res.groups || res.groups.length === 0) return '<p class="empty-note">目前還沒有記帳資料。</p>';
    recentAccountingCache = {};
    res.groups.forEach(g => g.items.forEach(it => { recentAccountingCache[it.row] = it; }));
    return res.groups.map(g =>
      '<div class="day-group"><div class="day-header">' + esc(g.date) + '</div>' +
      g.items.map(it =>
        '<div class="stop-row"><div class="stop-row-inner"><div class="stop-main">' +
        '<div class="stop-loc">' + esc(it.item) + '　' + esc(it.amount) + esc(it.currency) + '</div>' +
        '<div class="stop-detail">付款人 ' + esc(it.payer) + '　' + esc(it.type) + '</div></div>' +
        '<button class="del-btn" onclick="startEditExpense(' + it.row + ')">' + ICONS.edit + '</button>' +
        '<button class="del-btn" onclick="deleteAccountingRow(' + it.row + ')">' + ICONS.trash + '</button>' +
        '</div></div>'
      ).join('') + '</div>'
    ).join('');
  }

  function deleteAccountingRow(row) {
    if (!confirm('確定要刪除這筆記帳資料嗎？')) return;
    jsonp({ action: 'deleteAccountingRow', row: row })
      .then(res => { loadRecentAccounting(); loadSettlement(); })
      .catch(err => { alert('刪除失敗：' + err.message); });
  }

  let editingRow = null;

  function startEditExpense(row) {
    const it = recentAccountingCache[row];
    if (!it) { alert('找不到這筆資料，請重新整理清單'); return; }
    editingRow = row;

    document.getElementById('m-item').value = it.item;
    document.getElementById('m-amount').value = it.amount;
    document.getElementById('m-otherAmount').value = it.otherShare || '';

    payer = it.payer;
    document.querySelectorAll('#payerGroup button').forEach(b => b.classList.toggle('active', b.dataset.val === it.payer));

    currency = it.currency;
    document.querySelectorAll('#currGroup button').forEach(b => b.classList.toggle('active', b.dataset.val === it.currency));

    type = it.type;
    document.querySelectorAll('#typeGroup button').forEach(b => b.classList.toggle('active', b.dataset.val === it.type));
    document.getElementById('specifiedBox').classList.toggle('hidden', type !== '指定');

    document.getElementById('m-form-title').textContent = '編輯記帳';
    document.getElementById('m-editing-note').classList.remove('hidden');
    document.getElementById('m-submitBtn').textContent = '更新記帳';
    document.getElementById('m-resultBox').innerHTML = '';

    switchToAddSubtab('money');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEditExpense() {
    editingRow = null;
    document.getElementById('m-item').value = '';
    document.getElementById('m-amount').value = '';
    document.getElementById('m-otherAmount').value = '';
    document.getElementById('m-form-title').textContent = '新增記帳';
    document.getElementById('m-editing-note').classList.add('hidden');
    document.getElementById('m-submitBtn').textContent = '送出記帳';
    document.getElementById('m-resultBox').innerHTML = '';
  }

  function switchToAddSubtab(group) {
    document.querySelectorAll('#view-' + group + ' .subtabs button').forEach((b, i) => b.classList.toggle('active', i === 0));
    document.getElementById(group + '-add').classList.add('active');
    document.getElementById(group + '-view').classList.remove('active');
  }

  function loadRecentAccounting() {
    document.getElementById('recentBox').innerHTML = '<p class="empty-note">載入中...</p>';
    jsonp({ action: 'getRecentAccountingStructured' })
      .then(res => { document.getElementById('recentBox').innerHTML = renderRecentAccounting(res); })
      .catch(err => { document.getElementById('recentBox').innerHTML = '<p class="empty-note">讀取失敗：' + esc(err.message) + '</p>'; });
  }

  /* ---------- 匯率換算 ---------- */
  function submitExchange() {
    const amount = document.getElementById('ex-amount').value.trim();
    if (!amount) { showResult('ex-resultBox', { ok: false, message: '請輸入金額' }); return; }
    const to = exFrom === '日' ? '台' : '日';

    const btn = document.getElementById('ex-submitBtn');
    btn.disabled = true; btn.textContent = '換算中...';

    jsonp({ action: 'exchange', from: exFrom, to: to, amount: amount })
      .then(res => { btn.disabled = false; btn.textContent = '換算'; showResult('ex-resultBox', res); })
      .catch(err => { btn.disabled = false; btn.textContent = '換算'; showError('ex-resultBox', err); });
  }

  /* ---------- 行程：新增 ---------- */
  function submitItinerary() {
    const location = document.getElementById('t-location').value.trim();
    const date = document.getElementById('t-date').value.trim();
    const time = document.getElementById('t-time').value.trim();
    const region = document.getElementById('t-region').value.trim();
    if (!location) { showResult('t-resultBox', { ok: false, message: '請填寫地點' }); return; }

    const btn = document.getElementById('t-submitBtn');
    btn.disabled = true; btn.textContent = '送出中...';

    jsonp({ action: 'addItinerary', location, date, time, region })
      .then(res => {
        btn.disabled = false; btn.textContent = '送出行程';
        showResult('t-resultBox', res);
        if (res.ok) {
          document.getElementById('t-location').value = '';
          document.getElementById('t-date').value = '';
          document.getElementById('t-time').value = '';
          document.getElementById('t-region').value = '';
        }
      })
      .catch(err => { btn.disabled = false; btn.textContent = '送出行程'; showError('t-resultBox', err); });
  }

  /* ---------- 行程：查看 ---------- */
  function renderStop(s) {
    const details = [];
    if (s.address) details.push('📍 ' + esc(s.address));
    if (s.map) details.push('<a href="' + esc(s.map) + '" target="_blank" rel="noopener">地圖連結</a>');
    if (s.transport) details.push('🚃 ' + esc(s.transport));
    if (s.note) details.push(esc(s.note));
    const detailHtml = details.length ? '<div class="stop-detail">' + details.join('　') + '</div>' : '';
    const timeHtml = s.time
      ? '<div class="stop-time">' + esc(s.time) + '</div>'
      : '<div class="stop-time empty">・</div>';
    return '<div class="stop-row">' + timeHtml +
      '<div class="stop-row-inner"><div class="stop-main"><div class="stop-loc">' + esc(s.location) + '</div>' + detailHtml + '</div>' +
      '<button class="del-btn" onclick="deleteItineraryRow(' + s.row + ')">' + ICONS.trash + '</button>' +
      '</div></div>';
  }

  function deleteItineraryRow(row) {
    if (!confirm('確定要刪除這筆行程嗎？')) return;
    jsonp({ action: 'deleteItineraryRow', row: row })
      .then(res => { loadItineraryStructured(); })
      .catch(err => { alert('刪除失敗：' + err.message); });
  }

  function loadItineraryStructured() {
    document.getElementById('itineraryDays').innerHTML = '<p class="empty-note">載入中...</p>';
    document.getElementById('itineraryUnscheduled').innerHTML = '<p class="empty-note">載入中...</p>';

    jsonp({ action: 'getItineraryStructured' }).then(res => {
      if (!res.ok) {
        document.getElementById('itineraryDays').innerHTML = '<p class="empty-note">' + esc(res.message) + '</p>';
        return;
      }
      if (!res.days || res.days.length === 0) {
        document.getElementById('itineraryDays').innerHTML = '<p class="empty-note">目前還沒有已排定日期的行程。</p>';
      } else {
        document.getElementById('itineraryDays').innerHTML = res.days.map(day =>
          '<div class="day-group"><div class="day-header">' + esc(day.date) + '</div>' +
          day.stops.map(renderStop).join('') + '</div>'
        ).join('');
      }

      if (!res.unscheduledGroups || res.unscheduledGroups.length === 0) {
        document.getElementById('itineraryUnscheduled').innerHTML = '<p class="empty-note">目前沒有尚未安排的地點。</p>';
      } else {
        document.getElementById('itineraryUnscheduled').innerHTML = res.unscheduledGroups.map(g =>
          '<div class="day-group"><div class="day-header">' + esc(g.region) + '</div>' +
          '<div class="chip-wrap">' + g.items.map(it =>
            '<span class="unscheduled-chip-wrap">' + (it.map
              ? '<a class="unscheduled-chip" href="' + esc(it.map) + '" target="_blank" rel="noopener">' + esc(it.location) + '</a>'
              : '<span class="unscheduled-chip">' + esc(it.location) + '</span>') +
            '<button class="del-btn" onclick="deleteItineraryRow(' + it.row + ')">' + ICONS.trash + '</button></span>'
          ).join('') + '</div></div>'
        ).join('');
      }
    }).catch(err => {
      document.getElementById('itineraryDays').innerHTML = '<p class="empty-note">讀取失敗：' + esc(err.message) + '</p>';
    });
  }

  /* ---------- 購物：新增 ---------- */
  function submitShopping() {
    const item = document.getElementById('s-item').value.trim();
    const date = document.getElementById('s-date').value.trim();
    if (!item) { showResult('s-resultBox', { ok: false, message: '請填寫物品名稱' }); return; }

    const btn = document.getElementById('s-submitBtn');
    btn.disabled = true; btn.textContent = '送出中...';

    jsonp({ action: 'addShopping', item, date })
      .then(res => {
        btn.disabled = false; btn.textContent = '加入清單';
        showResult('s-resultBox', res);
        if (res.ok) {
          document.getElementById('s-item').value = '';
          document.getElementById('s-date').value = '';
        }
      })
      .catch(err => { btn.disabled = false; btn.textContent = '加入清單'; showError('s-resultBox', err); });
  }

  function submitBought() {
    const item = document.getElementById('s-boughtItem').value.trim();
    if (!item) { showResult('s-boughtResultBox', { ok: false, message: '請填寫物品名稱' }); return; }

    const btn = document.getElementById('s-boughtBtn');
    btn.disabled = true; btn.textContent = '送出中...';

    jsonp({ action: 'markBought', item })
      .then(res => {
        btn.disabled = false; btn.textContent = '標記已買';
        showResult('s-boughtResultBox', res);
        if (res.ok) { document.getElementById('s-boughtItem').value = ''; }
      })
      .catch(err => { btn.disabled = false; btn.textContent = '標記已買'; showError('s-boughtResultBox', err); });
  }

  function submitPriceCompare() {
    const item = document.getElementById('s-cItem').value.trim();
    const vendor = document.getElementById('s-vendor').value.trim();
    const price = document.getElementById('s-price').value.trim();
    if (!item || !vendor || !price) { showResult('s-priceResultBox', { ok: false, message: '物品、通路、價格都要填' }); return; }

    const btn = document.getElementById('s-priceBtn');
    btn.disabled = true; btn.textContent = '送出中...';

    jsonp({ action: 'addPriceCompare', item, vendor, price })
      .then(res => {
        btn.disabled = false; btn.textContent = '記錄比價';
        showResult('s-priceResultBox', res);
        if (res.ok) {
          document.getElementById('s-cItem').value = '';
          document.getElementById('s-vendor').value = '';
          document.getElementById('s-price').value = '';
        }
      })
      .catch(err => { btn.disabled = false; btn.textContent = '記錄比價'; showError('s-priceResultBox', err); });
  }

  /* ---------- 購物：查看 ---------- */
  function shoppingRow(name) {
    return '<div class="stop-row"><div class="stop-row-inner"><div class="stop-main"><div class="stop-loc">' + esc(name) + '</div></div>' +
      '<button class="del-btn" onclick="deleteShoppingItem(\'' + esc(name).replace(/'/g, "\\'") + '\')">' + ICONS.trash + '</button></div></div>';
  }
  function renderShopping(res) {
    if (!res.ok) return '<p class="empty-note">' + esc(res.message) + '</p>';
    let html = '';
    if (res.dated && res.dated.length) {
      html += res.dated.map(g =>
        '<div class="day-group"><div class="day-header">' + esc(g.date) + '</div>' +
        g.items.map(shoppingRow).join('') + '</div>'
      ).join('');
    }
    if (res.undated && res.undated.length) {
      html += '<div class="day-group"><div class="day-header">未指定日期</div>' +
        res.undated.map(shoppingRow).join('') + '</div>';
    }
    return html || '<p class="empty-note">購物清單目前是空的。</p>';
  }

  function deleteShoppingItem(item) {
    if (!confirm('確定要刪除「' + item + '」嗎？（同名的所有比價記錄也會一起刪除）')) return;
    jsonp({ action: 'deleteShoppingItem', item: item })
      .then(res => { loadShoppingStructured(); })
      .catch(err => { alert('刪除失敗：' + err.message); });
  }

  function loadShoppingStructured() {
    document.getElementById('shoppingBox').innerHTML = '<p class="empty-note">載入中...</p>';
    jsonp({ action: 'getShoppingStructured' })
      .then(res => { document.getElementById('shoppingBox').innerHTML = renderShopping(res); })
      .catch(err => { document.getElementById('shoppingBox').innerHTML = '<p class="empty-note">讀取失敗：' + esc(err.message) + '</p>'; });
  }

  mountIcons();
</script>
